version: '3.9'

services:
  dungeonprinter:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
    labels:
      io.casaos.category: "Games"
      io.casaos.port: "8000"
      #io.casaos.icon: "https://example.com/icon.png"
      io.casaos.description: "RPG Dungeon & Encounter Generator with OpenAI"      